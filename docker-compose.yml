services:
  # ---------------------------------------------------------------
  # WhatsApp Service (must start first — orchestrator registers webhook)
  # ---------------------------------------------------------------
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    image: naradaagastya/gc-whatsapp:latest
    container_name: gc-whatsapp
    restart: unless-stopped
    ports:
      - "3110:3100"
    volumes:
      - ./whatsapp-service/auth_store:/app/auth_store
      - ./whatsapp-service/auth_store_backup:/app/auth_store_backup
      - ./whatsapp-service/auth_store_device_1:/app/auth_store_device_1
      - ./whatsapp-service/auth_store_device_2:/app/auth_store_device_2
      - ./whatsapp-service/auth_store_device_3:/app/auth_store_device_3
      - ./whatsapp-service/auth_store_device_4:/app/auth_store_device_4
      - ./whatsapp-service/auth_store_device_5:/app/auth_store_device_5
      - ./whatsapp-service/data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - gc-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/status', r => { r.on('data', () => {}); process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------
  # Cloudflare WARP — SOCKS5 proxy to bypass ISP DPI blocking
  # (Indonesian ISPs block DuckDuckGo via TLS/SNI inspection)
  # ---------------------------------------------------------------
  warp:
    image: caomingjun/warp:latest
    container_name: gc-warp
    restart: unless-stopped
    privileged: true
    environment:
      - WARP_SLEEP=5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - gc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 300s

  # ---------------------------------------------------------------
  # Cloudflare WARP #2 — second egress IP for proxy rotation
  # Port 1081 exposed to host so local orchestrator can use it
  # ---------------------------------------------------------------
  warp2:
    image: caomingjun/warp:latest
    container_name: gc-warp2
    restart: unless-stopped
    ports:
      - "1081:1080"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp2-data:/var/lib/cloudflare-warp
    networks:
      - gc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--socks5", "127.0.0.1:1080", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------
  # PinchTab (Headless browser automation via HTTP)
  # ---------------------------------------------------------------
  pinchtab:
    image: pinchtab/pinchtab:latest
    container_name: gc-pinchtab
    restart: unless-stopped
    ports:
      - "9867:9867"
    volumes:
      - pinchtab-data:/data
    shm_size: '2gb'
    networks:
      - gc-network

  # NOTE: ChatGPT OAuth (Codex subscription access) runs IN-PROCESS in
  # the orchestrator — see orchestrator/llm/codex_*.py. No sidecar
  # container needed. The OAuth callback server binds to localhost:1455
  # only when actively logging in. Tokens persist at data/codex_auth/.

  # ---------------------------------------------------------------
  # Orchestrator (Python FastAPI)
  # ---------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: naradaagastya/gc-orchestrator:latest
    container_name: gc-orchestrator
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.production
    environment:
      - WA_SERVICE_URL=http://whatsapp:3100
      - WEBHOOK_URL=http://orchestrator:8000/webhook/incoming
      - DATABASE_PATH=data/getcontact.db
      - DDG_PROXY=socks5h://warp:1080
      - DDGS_PROXY=socks5h://warp:1080
      - PINCHTAB_URL=http://pinchtab:9867
      - SMTP_SOCKS_ENABLED=true
      - SMTP_SOCKS_HOST=warp
      - SMTP_SOCKS_PORT=1080
      # Sentry release tag — injected by GitLab CI deploy script
      # ($CI_COMMIT_SHORT_SHA). Other SENTRY_* vars come from .env.production.
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    depends_on:
      whatsapp:
        condition: service_healthy
      warp:
        condition: service_started
      warp2:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gc-network

  # ---------------------------------------------------------------
  # Frontend (React built → served by internal Nginx)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: naradaagastya/gc-frontend:latest
    container_name: gc-frontend
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on:
      - orchestrator
    networks:
      - gc-network

networks:
  gc-network:
    driver: bridge

volumes:
  warp-data:
  warp2-data:
  pinchtab-data:
