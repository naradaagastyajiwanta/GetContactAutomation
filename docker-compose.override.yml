# docker-compose.override.yml
# ----------------------------------------------------------
# Development override for FAST deployment.
# Mounts source code as volumes so that code changes are
# reflected without rebuilding images.
#
# - Orchestrator: source mounted + uvicorn --reload (auto-restart on change)
# - WhatsApp: source mounted + ts-node (TypeScript on-the-fly, no compile)
# - Frontend: NO OVERRIDE on production — uses built image with 'serve' on port 3010
#
# This file is auto-loaded by docker compose alongside
# docker-compose.yml. To DISABLE it (use baked-in image),
# rename it or pass --file explicitly:
#   docker compose -f docker-compose.yml up -d --build
# ----------------------------------------------------------

services:
  orchestrator:
    volumes:
      - ./data:/app/data
      - ./orchestrator:/app/orchestrator
      - ./scripts:/app/scripts
    command: ["uvicorn", "orchestrator.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
      target: deps
    volumes:
      - ./whatsapp-service/src:/app/src
      - ./whatsapp-service/tsconfig.json:/app/tsconfig.json
      - ./whatsapp-service/auth_store:/app/auth_store
      - ./whatsapp-service/auth_store_backup:/app/auth_store_backup
      - ./whatsapp-service/auth_store_device_1:/app/auth_store_device_1
      - ./whatsapp-service/auth_store_device_2:/app/auth_store_device_2
      - ./whatsapp-service/auth_store_device_3:/app/auth_store_device_3
      - ./whatsapp-service/auth_store_device_4:/app/auth_store_device_4
      - ./whatsapp-service/auth_store_device_5:/app/auth_store_device_5
      - ./whatsapp-service/data:/app/data
    command: ["npx", "ts-node", "src/index.ts"]

# Frontend override intentionally removed from production.
