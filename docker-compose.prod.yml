# docker-compose.prod.yml
# ----------------------------------------------------------
# Production compose file for VPS.
# Builds images directly from source on the VPS — no Docker Hub.
#
# Usage on VPS:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# ----------------------------------------------------------

services:
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: gc-whatsapp
    restart: unless-stopped
    ports:
      - "3110:3100"
    volumes:
      - ./whatsapp-service/auth_store:/app/auth_store
      - ./whatsapp-service/auth_store_backup:/app/auth_store_backup
      - ./whatsapp-service/auth_store_device_1:/app/auth_store_device_1
      - ./whatsapp-service/auth_store_device_2:/app/auth_store_device_2
      - ./whatsapp-service/auth_store_device_3:/app/auth_store_device_3
      - ./whatsapp-service/auth_store_device_4:/app/auth_store_device_4
      - ./whatsapp-service/auth_store_device_5:/app/auth_store_device_5
      - ./whatsapp-service/data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - gc-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/status', r => { r.on('data', () => {}); process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  warp:
    image: caomingjun/warp:latest
    container_name: gc-warp
    restart: unless-stopped
    privileged: true
    environment:
      - WARP_SLEEP=5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - gc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 300s

  warp2:
    image: caomingjun/warp:latest
    container_name: gc-warp2
    restart: unless-stopped
    ports:
      - "1081:1080"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp2-data:/var/lib/cloudflare-warp
    networks:
      - gc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 300s

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: gc-orchestrator
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8010:8000"
      - "127.0.0.1:1455:8000"  # SSH tunnel OAuth: ssh -L 1455:localhost:1455 server
    volumes:
      - ./data:/app/data
      - ./.codex:/root/.codex:ro
    env_file:
      - .env.production
    environment:
      - WA_SERVICE_URL=http://whatsapp:3100
      - WEBHOOK_URL=http://orchestrator:8000/webhook/incoming
      - DATABASE_PATH=data/getcontact.db
      - DDG_PROXY=socks5h://warp:1080
      - DDGS_PROXY=socks5h://warp:1080
      - SMTP_SOCKS_ENABLED=true
      - SMTP_SOCKS_HOST=warp
      - SMTP_SOCKS_PORT=1080
      # SENTRY_RELEASE is usually injected by GitLab CI deploy script
      # ($CI_COMMIT_SHORT_SHA) so errors are tagged with the commit
      # that introduced them. Falls back to empty if not set — Sentry
      # then groups errors without release correlation.
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    depends_on:
      whatsapp:
        condition: service_healthy
      warp:
        condition: service_started
      warp2:
        condition: service_started
    networks:
      - gc-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gc-frontend
    restart: unless-stopped
    expose:
      - "3010"
    depends_on:
      - orchestrator
    networks:
      - gc-network

  nginx:
    image: nginx:alpine
    container_name: gc-nginx
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - orchestrator
    networks:
      - gc-network

networks:
  gc-network:
    driver: bridge

volumes:
  warp-data:
  warp2-data:
