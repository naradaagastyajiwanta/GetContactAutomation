image: alpine:3.19

stages:
  - test
  - deploy
  - verify

variables:
  VPS_PORT: "22"
  DEPLOY_DIR: "/var/www/get_contact_jiwan"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

# =============================================================================
# TEST STAGE — parallel validation before deploy
# =============================================================================
# Hard gates (block deploy on failure): python_smoke_test, frontend_typecheck
# Soft gate  (visible in MR but non-blocking): whatsapp_test
#   Reason: 7/29 existing timer-based Jest tests fail locally (fake timer
#   race conditions in rateLimiter / messageQueue). Production logic is
#   unaffected; tests need maintenance. Remove `allow_failure: true` once
#   those are stabilized in a dedicated PR.
# -----------------------------------------------------------------------------

python_smoke_test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends gcc > /dev/null
    - pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - echo "[1/2] LLM client factory — singleton + base_url routing"
    - PYTHONPATH=. python scripts/test_llm_factory.py
    - echo "[2/2] LLM gateway — 6 routing scenarios (Codex/fallback/cooldown/embeddings)"
    - PYTHONPATH=. python scripts/test_llm_gateway.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

frontend_typecheck:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - echo "TypeScript strict check on React dashboard"
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

whatsapp_test:
  stage: test
  image: node:20-alpine
  allow_failure: true   # TODO: stabilize 7 timer-based tests then promote to hard gate
  cache:
    key:
      files:
        - whatsapp-service/package-lock.json
    paths:
      - whatsapp-service/node_modules
  before_script:
    - apk add --no-cache git python3 make g++
    - cd whatsapp-service
    - npm ci --prefer-offline --no-audit --no-fund --legacy-peer-deps
  script:
    - npm test -- --ci --coverage --coverageReporters=cobertura --coverageReporters=text --testTimeout=15000
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: whatsapp-service/coverage/cobertura-coverage.xml
    paths:
      - whatsapp-service/coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

# =============================================================================
# DEPLOY STAGE — only proceeds if hard-gate tests pass
# =============================================================================

deploy:
  stage: deploy
  needs:
    - job: python_smoke_test
    - job: frontend_typecheck
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"
  before_script:
    - apk add --no-cache openssh-client git bash sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      if [ -z "$VPS_PASSWORD" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
        echo "ERROR: VPS_PASSWORD, VPS_HOST, or VPS_USER is not set."
        exit 1
      fi
      echo "Deploying $VPS_USER@$VPS_HOST:$VPS_PORT"
      if [ -n "$DEPLOY_TOKEN_USER" ] && [ -n "$DEPLOY_TOKEN_PASS" ]; then
        REPO_URL="https://${DEPLOY_TOKEN_USER}:${DEPLOY_TOKEN_PASS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        REPO_URL="${CI_REPOSITORY_URL}"
      fi
      echo "--- Fix deploy dir ownership (docker runs as root, no sudo needed) ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "UID_GID=\"\$(id -u):\$(id -g)\" && docker run --rm -v /var/www:/var/www alpine sh -c \"mkdir -p $DEPLOY_DIR $DEPLOY_DIR/data && chown -R \${UID_GID} $DEPLOY_DIR\""
      echo "--- Clone/fetch ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && if [ -d .git ]; then git -c safe.directory=$DEPLOY_DIR fetch origin main --depth=5 && git -c safe.directory=$DEPLOY_DIR reset --hard $CI_COMMIT_SHA && echo OK; else git -c safe.directory=$DEPLOY_DIR clone --depth=5 --branch main $REPO_URL . && echo OK; fi"
      echo "--- Env file ---"
      if [ -n "$ENV_PRODUCTION" ]; then
        printf '%s' "$ENV_PRODUCTION" > /tmp/env_production_deploy
        sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" /tmp/env_production_deploy "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/.env.production"
        rm -f /tmp/env_production_deploy
        echo "env written from CI variable"
      else
        echo "WARNING: ENV_PRODUCTION not set, using existing .env.production on VPS"
      fi
      echo "--- DB inject (one-time) ---"
      if [ -n "$DB_PRODUCTION_B64" ]; then
        echo "$DB_PRODUCTION_B64" | base64 -d > /tmp/getcontact_inject.db
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
          "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml stop orchestrator 2>/dev/null || true && cp data/getcontact.db data/getcontact_before_inject.db 2>/dev/null || true"
        sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" /tmp/getcontact_inject.db "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/data/getcontact.db"
        rm -f /tmp/getcontact_inject.db
        echo "DB injected — delete DB_PRODUCTION_B64 variable from GitLab after this run"
      else
        echo "DB_PRODUCTION_B64 not set, skipping DB inject"
      fi
      echo "--- Permissions ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "mkdir -p $DEPLOY_DIR/data $DEPLOY_DIR/data/audiensi_docs $DEPLOY_DIR/data/templates $DEPLOY_DIR/data/ig_sessions $DEPLOY_DIR/data/pw_sessions && mkdir -p $DEPLOY_DIR/whatsapp-service/auth_store $DEPLOY_DIR/whatsapp-service/auth_store_backup && mkdir -p $DEPLOY_DIR/whatsapp-service/auth_store_device_1 $DEPLOY_DIR/whatsapp-service/auth_store_device_2 $DEPLOY_DIR/whatsapp-service/auth_store_device_3 $DEPLOY_DIR/whatsapp-service/auth_store_device_4 $DEPLOY_DIR/whatsapp-service/auth_store_device_5 $DEPLOY_DIR/whatsapp-service/auth_store_u195 $DEPLOY_DIR/whatsapp-service/auth_store_u90 $DEPLOY_DIR/whatsapp-service/auth_store_u195_1 $DEPLOY_DIR/whatsapp-service/auth_store_u195_2 $DEPLOY_DIR/whatsapp-service/auth_store_u195_3 $DEPLOY_DIR/whatsapp-service/auth_store_u195_4 $DEPLOY_DIR/whatsapp-service/auth_store_u195_5 $DEPLOY_DIR/whatsapp-service/data && ls $DEPLOY_DIR/.env.production && echo env_exists || echo env_missing"
      echo "--- Build & Up (with SENTRY_RELEASE=$CI_COMMIT_SHORT_SHA) ---"
      # SENTRY_RELEASE is passed via an env-prefix so docker compose
      # substitutes ${SENTRY_RELEASE:-} in docker-compose.prod.yml → the
      # orchestrator container picks it up at startup and every error
      # captured by Sentry is tagged with this commit SHA.
      #
      # nginx restart at the end: when `docker compose up -d` recreates
      # orchestrator / frontend, those containers get new IPs on the
      # bridge network. nginx caches upstream DNS resolution at startup
      # (stock OSS nginx, no Plus) so it keeps routing to the old IPs
      # until reloaded, producing a 502 Bad Gateway storm. The nginx
      # config now uses Docker's embedded resolver (127.0.0.11) for
      # runtime re-resolution, but we still force a restart here so
      # the FIRST request after deploy hits a warm cache instead of
      # waiting for the `valid=10s` TTL to refresh.
      #
      # WA session protection: the whatsapp container is ONLY rebuilt and
      # restarted when whatsapp-service/ or Dockerfile.whatsapp actually
      # changed. Otherwise we rebuild only orchestrator+frontend so Baileys
      # sessions survive the deploy without needing a QR re-scan.
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && \
         WA_CHANGED=\$(git log --name-only --format='' HEAD~5..HEAD -- whatsapp-service/ Dockerfile.whatsapp 2>/dev/null | grep -c . || echo 0); \
         echo \"WA service changed: \$WA_CHANGED files\"; \
         if [ \"\$WA_CHANGED\" -gt \"0\" ]; then \
           echo 'Rebuilding ALL services (whatsapp changed)'; \
           SENTRY_RELEASE=$CI_COMMIT_SHORT_SHA docker compose -f docker-compose.prod.yml build; \
           SENTRY_RELEASE=$CI_COMMIT_SHORT_SHA docker compose -f docker-compose.prod.yml up -d --remove-orphans; \
         else \
           echo 'Rebuilding orchestrator+frontend only (whatsapp unchanged — sessions preserved)'; \
           SENTRY_RELEASE=$CI_COMMIT_SHORT_SHA docker compose -f docker-compose.prod.yml build orchestrator frontend; \
           SENTRY_RELEASE=$CI_COMMIT_SHORT_SHA docker compose -f docker-compose.prod.yml up -d orchestrator frontend nginx --remove-orphans; \
         fi && \
         docker compose -f docker-compose.prod.yml restart nginx && \
         docker system prune -f --filter until=72h 2>/dev/null || true"
      echo "--- Status ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml ps"
      echo "--- Done ---"

verify:
  stage: verify
  before_script:
    - apk add --no-cache openssh-client curl sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      echo "Verification..."
      sleep 30
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml ps"
      echo "--- Orchestrator health ---"
      for i in 1 2 3; do
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -sf http://localhost:8010/health" && break
        echo "Attempt $i failed, retrying in 10s..."
        sleep 10
      done
      echo "--- Frontend ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -so /dev/null -w 'HTTP %{http_code}' http://localhost:3010/"
      echo ""
      echo "OK"
