image: alpine:3.19

stages:
  - deploy
  - verify

variables:
  VPS_PORT: "22"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

deploy:
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client git bash sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      if [ -z "$VPS_PASSWORD" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
        echo "ERROR: VPS_PASSWORD, VPS_HOST, or VPS_USER is not set."
        exit 1
      fi
      echo "Deploying $VPS_USER@$VPS_HOST:$VPS_PORT"
      if [ -n "$DEPLOY_TOKEN_USER" ] && [ -n "$DEPLOY_TOKEN_PASS" ]; then
        REPO_URL="https://${DEPLOY_TOKEN_USER}:${DEPLOY_TOKEN_PASS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        REPO_URL="${CI_REPOSITORY_URL}"
      fi
      echo "--- Clone/fetch ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "mkdir -p /var/www/get_contact_jiwan && chown -R $VPS_USER:$VPS_USER /var/www/get_contact_jiwan/data 2>/dev/null || true && cd /var/www/get_contact_jiwan && if [ -d .git ]; then git -c safe.directory=/var/www/get_contact_jiwan fetch origin main --depth=5 && git -c safe.directory=/var/www/get_contact_jiwan reset --hard $CI_COMMIT_SHA && echo OK; else git -c safe.directory=/var/www/get_contact_jiwan clone --depth=5 --branch main $REPO_URL . && echo OK; fi"
      echo "--- Env file ---"
      if [ -n "$ENV_PRODUCTION" ]; then
        printf '%s' "$ENV_PRODUCTION" > /tmp/env_production_deploy
        sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" /tmp/env_production_deploy "$VPS_USER@$VPS_HOST:/var/www/get_contact_jiwan/.env.production"
        rm -f /tmp/env_production_deploy
        echo "env written from CI variable"
      else
        echo "WARNING: ENV_PRODUCTION not set, using existing .env.production on VPS"
      fi
      echo "--- DB inject (one-time) ---"
      if [ -n "$DB_PRODUCTION_B64" ]; then
        echo "$DB_PRODUCTION_B64" | base64 -d > /tmp/getcontact_inject.db
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
          "cd /var/www/get_contact_jiwan && docker compose -f docker-compose.prod.yml stop orchestrator 2>/dev/null || true && cp data/getcontact.db data/getcontact_before_inject.db 2>/dev/null || true"
        sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" /tmp/getcontact_inject.db "$VPS_USER@$VPS_HOST:/var/www/get_contact_jiwan/data/getcontact.db"
        rm -f /tmp/getcontact_inject.db
        echo "DB injected — delete DB_PRODUCTION_B64 variable from GitLab after this run"
      else
        echo "DB_PRODUCTION_B64 not set, skipping DB inject"
      fi
      echo "--- Permissions ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "chown -R $VPS_USER:$VPS_USER /var/www/get_contact_jiwan && mkdir -p /var/www/get_contact_jiwan/data /var/www/get_contact_jiwan/data/audiensi_docs /var/www/get_contact_jiwan/data/templates /var/www/get_contact_jiwan/data/ig_sessions /var/www/get_contact_jiwan/data/pw_sessions && mkdir -p /var/www/get_contact_jiwan/whatsapp-service/auth_store /var/www/get_contact_jiwan/whatsapp-service/auth_store_backup && mkdir -p /var/www/get_contact_jiwan/whatsapp-service/auth_store_device_1 /var/www/get_contact_jiwan/whatsapp-service/auth_store_device_2 /var/www/get_contact_jiwan/whatsapp-service/auth_store_device_3 /var/www/get_contact_jiwan/whatsapp-service/auth_store_device_4 /var/www/get_contact_jiwan/whatsapp-service/auth_store_device_5 /var/www/get_contact_jiwan/whatsapp-service/data && ls /var/www/get_contact_jiwan/.env.production && echo env_exists || echo env_missing"
      echo "--- Build & Up ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd /var/www/get_contact_jiwan && docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker system prune -f --filter until=72h 2>/dev/null || true"
      echo "--- Status ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd /var/www/get_contact_jiwan && docker compose -f docker-compose.prod.yml ps"
      echo "--- Done ---"

verify:
  stage: verify
  before_script:
    - apk add --no-cache openssh-client curl sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      echo "Verification..."
      sleep 30
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd /var/www/get_contact_jiwan && docker compose -f docker-compose.prod.yml ps"
      echo "--- Orchestrator health ---"
      for i in 1 2 3; do
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -sf http://localhost:8010/health" && break
        echo "Attempt $i failed, retrying in 10s..."
        sleep 10
      done
      echo "--- Frontend ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "curl -so /dev/null -w 'HTTP %{http_code}' http://localhost:3010/"
      echo ""
      echo "OK"
