server {
    listen 80;
    server_name get-contact-automation.airabot.id;

    # ------------------------------------------------------------------
    # Docker DNS resolver for runtime upstream re-resolution
    # ------------------------------------------------------------------
    # Without this, stock OSS nginx resolves each hostname in
    # `proxy_pass` exactly once at startup and caches the IP forever.
    # After a `docker compose up -d` that recreates containers, the
    # bridge-network IPs can swap (e.g. orchestrator and frontend
    # trading 172.25.0.4 / 172.25.0.7), and nginx happily keeps
    # routing to the STALE IPs → `connect() failed (111: Connection
    # refused)` 502 storm until nginx is reloaded.
    #
    # 127.0.0.11 is the fixed IP of Docker's built-in DNS server on
    # user-defined networks. Combined with a `valid=10s` TTL and the
    # variable-form `proxy_pass $var;` trick below, nginx re-resolves
    # upstream hostnames at most every 10 seconds, so future deploys
    # self-heal even if we forget to restart nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Max upload size (for CSV/Excel imports)
    client_max_body_size 50M;

    # ------------------------------------------------------------------
    # API → Orchestrator (Python FastAPI)
    # ------------------------------------------------------------------
    # NOTE: `set $... http://...;` + `proxy_pass $var;` forces nginx to
    # consult the Docker resolver on every request (bounded by the
    # `valid=10s` TTL above) instead of caching a startup resolution.
    # Because we need to strip `/api`, we construct the full upstream
    # URL explicitly: host from $api_upstream, rewritten path from
    # $uri, query string from $is_args$args.
    #
    # Ordering matters: `set` and `rewrite` both belong to the
    # ngx_http_rewrite_module, and `rewrite ... break;` halts further
    # execution of that module inside this location. So `set` must
    # come BEFORE `rewrite`, otherwise `$api_upstream` ends up empty
    # and proxy_pass sees `/auth/...` as the whole URL → 500 with
    # "invalid URL prefix" in the error log.
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        set $api_upstream http://orchestrator:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $api_upstream$uri$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Webhook endpoint (no /api prefix — direct to orchestrator)
    location /webhook/ {
        set $webhook_upstream http://orchestrator:8000;
        proxy_pass $webhook_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check (direct, no /api prefix)
    location = /health {
        set $health_upstream http://orchestrator:8000;
        proxy_pass $health_upstream;
    }

    # ------------------------------------------------------------------
    # WebSocket → Orchestrator
    # ------------------------------------------------------------------
    location /ws {
        set $ws_upstream http://orchestrator:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # Frontend (React SPA — catch-all)
    # ------------------------------------------------------------------
    location / {
        set $fe_upstream http://frontend:3010;
        proxy_pass $fe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
