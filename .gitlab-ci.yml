image: alpine:3.19

stages:
  - deploy
  - verify

variables:
  DEPLOY_DIR: "/var/www/get_contact_jiwan"
  VPS_PORT: "22"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

deploy:
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client git bash sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      if [ -z "$VPS_PASSWORD" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
        echo "ERROR: VPS_PASSWORD, VPS_HOST, or VPS_USER is not set."
        exit 1
      fi
      echo "Deploying to $VPS_USER@$VPS_HOST:$VPS_PORT / $CI_COMMIT_SHORT_SHA"
      echo "--- Step 1: Sync code ---"
      if [ -n "$DEPLOY_TOKEN_USER" ] && [ -n "$DEPLOY_TOKEN_PASS" ]; then
        REPO_URL="https://${DEPLOY_TOKEN_USER}:${DEPLOY_TOKEN_PASS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        REPO_URL="${CI_REPOSITORY_URL}"
      fi
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "mkdir -p $DEPLOY_DIR && cd $DEPLOY_DIR && if [ -d .git ]; then git fetch origin main --depth=5 && git reset --hard $CI_COMMIT_SHA && echo OK; else git clone --depth=5 --branch main $REPO_URL . && echo OK; fi && mkdir -p data data/audiensi_docs data/templates data/ig_sessions data/pw_sessions && mkdir -p whatsapp-service/auth_store whatsapp-service/auth_store_backup whatsapp-service/auth_store_device_1 whatsapp-service/auth_store_device_2 whatsapp-service/auth_store_device_3 whatsapp-service/auth_store_device_4 whatsapp-service/auth_store_device_5 whatsapp-service/data && ls .env.production && echo .env.production exists || echo .env.production missing"
      echo "--- Step 2: Build & Up ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker system prune -f --filter until=72h 2>/dev/null || true && docker compose -f docker-compose.prod.yml ps"
      echo "--- Done ---"

verify:
  stage: verify
  before_script:
    - apk add --no-cache openssh-client curl sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      echo "=== Verification ==="
      sleep 20
      echo "--- Containers ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml ps"
      echo "--- Orchestrator health ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "curl -sf http://localhost:8000/health"
      echo "--- Frontend ---"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "curl -so /dev/null -w 'HTTP %{http_code}' http://localhost:3200/"
      echo ""
      echo "=== All OK ==="
