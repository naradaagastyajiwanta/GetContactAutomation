server {
    listen 80;
    server_name getcontact.najworks.me;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Max upload size (for CSV/Excel imports)
    client_max_body_size 50M;

    # ------------------------------------------------------------------
    # API → Orchestrator (Python FastAPI)
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        # Strip /api prefix → forward to orchestrator root
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Webhook endpoint (no /api prefix — direct to orchestrator)
    location /webhook/ {
        proxy_pass http://orchestrator:8000/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check (direct, no /api prefix)
    location = /health {
        proxy_pass http://orchestrator:8000/health;
    }

    # ------------------------------------------------------------------
    # WebSocket → Orchestrator
    # ------------------------------------------------------------------
    location /ws {
        proxy_pass http://orchestrator:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # Frontend (React SPA — catch-all)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
