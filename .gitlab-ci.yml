# =============================================================
# GetContact AI Agent — GitLab CI/CD Pipeline
# =============================================================
# Push to `main` → SSH to VPS → git pull → docker compose build → up
#
# Required GitLab CI/CD Variables:
#   VPS_HOST       - VPS IP address
#   VPS_USER       - SSH username (e.g. root)
#   VPS_PASSWORD   - SSH password
#   VPS_PORT       - SSH port (default: 22)
#
# Optional:
#   DEPLOY_DIR        - Remote path (default: /var/www/get_contact_jiwan)
#   DEPLOY_TOKEN_USER - GitLab deploy token user
#   DEPLOY_TOKEN_PASS - GitLab deploy token password
# =============================================================

stages:
  - deploy
  - verify

variables:
  DEPLOY_DIR: "/var/www/get_contact_jiwan"
  VPS_PORT: "22"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "manual"

# ---------------------------------------------------------------
# Stage 1: Deploy
# ---------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client git bash sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      set -e
      if [ -z "$VPS_PASSWORD" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
        echo "ERROR: VPS_PASSWORD, VPS_HOST, or VPS_USER is not set."
        exit 1
      fi
      echo "============================================="
      echo "  Deploying to $VPS_USER@$VPS_HOST:$VPS_PORT"
      echo "  Commit: $CI_COMMIT_SHORT_SHA"
      echo "============================================="
      if [ -n "$DEPLOY_TOKEN_USER" ] && [ -n "$DEPLOY_TOKEN_PASS" ]; then
        REPO_URL="https://${DEPLOY_TOKEN_USER}:${DEPLOY_TOKEN_PASS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        REPO_URL="${CI_REPOSITORY_URL}"
      fi
      echo "[Step 1] Syncing code..."
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_DIR" "$REPO_URL" "$CI_COMMIT_SHA" << 'EOSYNC'
        set -e; DEPLOY_DIR="$1"; REPO_URL="$2"; COMMIT_SHA="$3"
        mkdir -p "$DEPLOY_DIR"
        if [ -d "$DEPLOY_DIR/.git" ]; then
          cd "$DEPLOY_DIR" && git fetch origin main --depth=5 && git reset --hard "$COMMIT_SHA" && echo "  [OK] Code updated to $COMMIT_SHA"
        else
          git clone --depth=5 --branch main "$REPO_URL" "$DEPLOY_DIR" && echo "  [OK] Repo cloned"
        fi
        mkdir -p data data/audiensi_docs data/templates data/ig_sessions data/pw_sessions
        mkdir -p whatsapp-service/auth_store whatsapp-service/auth_store_backup whatsapp-service/auth_store_device_1 whatsapp-service/auth_store_device_2 whatsapp-service/auth_store_device_3 whatsapp-service/auth_store_device_4 whatsapp-service/auth_store_device_5 whatsapp-service/data
        if [ -f ".env.production" ]; then echo "  [OK] .env.production present"; else echo "  [WARN] .env.production not found!"; fi
EOSYNC
      echo ""
      echo "[Step 2] Building and restarting containers..."
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_DIR" << 'EOBUILD'
        set -e; DEPLOY_DIR="$1"; cd "$DEPLOY_DIR"
        echo "  Building images..."
        docker compose -f docker-compose.prod.yml build --pull
        echo "  Starting containers..."
        docker compose -f docker-compose.prod.yml up -d --remove-orphans
        docker system prune -f --filter "until=72h" 2>/dev/null || true
        echo "  [OK] Done"
        docker compose -f docker-compose.prod.yml ps
EOBUILD
      echo ""
      echo "============================================="
      echo "  [SUCCESS] Deploy complete"
      echo "  URL: https://get-contact-automation.airabot.id"
      echo "============================================="
  environment:
    name: production
    url: https://get-contact-automation.airabot.id

# ---------------------------------------------------------------
# Stage 2: Verify
# ---------------------------------------------------------------
verify:
  stage: verify
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client curl sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      set -e
      echo "============================================="
      echo "  Post-deploy verification"
      echo "============================================="
      sleep 20
      echo "[verify] Container status:"
      sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "cd $DEPLOY_DIR && docker compose -f docker-compose.prod.yml ps --format 'table {{.Name}}\t{{.Status}}'"
      echo ""
      echo "[verify] Orchestrator health:"
      HEALTH=$(sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "curl -sf http://localhost:8000/health 2>/dev/null" || echo "FAIL")
      if echo "$HEALTH" | grep -q "status"; then
        echo "  [OK] Orchestrator: $HEALTH"
      else
        sleep 10
        HEALTH=$(sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
          "curl -sf http://localhost:8000/health 2>/dev/null" || echo "FAIL")
        if echo "$HEALTH" | grep -q "status"; then
          echo "  [OK] Orchestrator (retry): $HEALTH"
        else
          echo "  [FAIL] Orchestrator unreachable"
          exit 1
        fi
      fi
      echo ""
      HTTP_CODE=$(sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "curl -so /dev/null -w '%{http_code}' http://localhost:3200/ 2>/dev/null" || echo "000")
      echo "  Frontend HTTP: $HTTP_CODE"
      WA=$(sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
        "curl -sf http://localhost:3100/status 2>/dev/null" || echo "")
      if echo "$WA" | grep -qE "status|connected"; then
        echo "  WhatsApp: [OK]"
      else
        echo "  WhatsApp: [INFO] may need QR scan"
      fi
      echo ""
      echo "============================================="
      echo "  [SUCCESS] Verification complete"
      echo "============================================="
  environment:
    name: production
    url: https://get-contact-automation.airabot.id
